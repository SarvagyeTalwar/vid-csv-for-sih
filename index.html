<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Action Sequence Labeler</title>
<style>
  :root {
    --bg: #16181c;
    --panel: #1e2126;
    --panel-2: #24282e;
    --border: #33383f;
    --text: #e9ebee;
    --text-dim: #8a919c;
    --amber: #e0973d;
    --amber-dim: #4a3a24;
    --done: #4f9d8a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header .sub {
    font-size: 12px;
    color: var(--text-dim);
  }
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 220px 1fr 300px;
    overflow: hidden;
  }
  .queue {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px;
  }
  .queue-item {
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12.5px;
    font-family: var(--mono);
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
  }
  .queue-item:hover { background: var(--panel-2); }
  .queue-item.active { background: var(--amber-dim); color: var(--text); }
  .queue-item.complete::after { content: "✓"; color: var(--done); }
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 16px;
    overflow-y: auto;
  }
  video {
    max-width: 100%;
    max-height: 46vh;
    background: #000;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .scrub-row {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type=range] { flex: 1; accent-color: var(--amber); }
  .time-display {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    min-width: 90px;
    text-align: right;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    font-family: var(--sans);
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  button:hover { border-color: var(--amber); }
  button.primary {
    background: var(--amber);
    color: #1a1305;
    border-color: var(--amber);
    font-weight: 600;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  .speed-group button.active { background: var(--amber-dim); border-color: var(--amber); }
  .upload-zone {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 40px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  .sequence {
    border-left: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sequence h2 {
    font-size: 11px;
    text-transform: none;
    color: var(--text-dim);
    margin: 0 0 8px 0;
    font-weight: 500;
  }
  .action-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 6px;
    background: var(--panel-2);
    border: 1px solid transparent;
  }
  .action-row.marked { border-color: var(--done); }
  .action-idx {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 14px;
  }
  .action-name {
    flex: 1;
    font-size: 13px;
  }
  .action-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--done);
    min-width: 46px;
    text-align: right;
  }
  .action-mark-btn {
    padding: 5px 9px;
    font-size: 11.5px;
  }
  .footer {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .hint {
    font-size: 11.5px;
    color: var(--text-dim);
  }
  kbd {
    font-family: var(--mono);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Action Sequence Labeler</h1>
  <span class="sub" id="statusLine">No videos loaded</span>
</header>

<div class="main">
  <div class="queue" id="queue"></div>

  <div class="center">
    <div id="uploadZone" class="upload-zone">
      Choose video files to begin — they'll queue up in the order you select them.<br><br>
      <input type="file" id="fileInput" accept="video/*" multiple>
    </div>

    <video id="player" controls style="display:none"></video>

    <div class="scrub-row" id="scrubRow" style="display:none">
      <span class="time-display" id="curTime">0.00s</span>
      <input type="range" id="scrub" min="0" max="100" value="0" step="0.01">
      <span class="time-display" id="durTime">0.00s</span>
    </div>

    <div class="controls" id="playControls" style="display:none">
      <button id="playBtn">Play / Pause</button>
      <button id="backBtn">« 0.1s</button>
      <button id="fwdBtn">0.1s »</button>
      <div class="speed-group">
        <button data-speed="0.25">0.25x</button>
        <button data-speed="0.5">0.5x</button>
        <button data-speed="1" class="active">1x</button>
      </div>
    </div>
  </div>

  <div class="sequence" id="sequence">
    <h2>Mark each action's start</h2>
  </div>
</div>

<div class="footer">
  <span class="hint">Press <kbd>1</kbd>–<kbd>8</kbd> to mark actions at the current time, <kbd>space</kbd> to play/pause</span>
  <div>
    <button id="prevBtn">Previous video</button>
    <button id="nextBtn">Next video</button>
    <button id="exportBtn" class="primary">Export CSV</button>
  </div>
</div>

<script>
const ACTIONS = [
  "go_to_box",
  "touch_open_box",
  "reach_for_red_box",
  "keep_red_box_on_table",
  "reach_for_yellow_box",
  "keep_yellow_box_on_table",
  "close_box",
  "leave_and_go"
];

let videos = [];       // {file, name, url, marks: [null x8], duration}
let currentIdx = -1;

const fileInput = document.getElementById("fileInput");
const uploadZone = document.getElementById("uploadZone");
const player = document.getElementById("player");
const scrubRow = document.getElementById("scrubRow");
const playControls = document.getElementById("playControls");
const scrub = document.getElementById("scrub");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const queueEl = document.getElementById("queue");
const sequenceEl = document.getElementById("sequence");
const statusLine = document.getElementById("statusLine");

function buildSequenceUI() {
  sequenceEl.innerHTML = '<h2>Mark each action\'s start</h2>';
  ACTIONS.forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "action-row";
    row.id = "action-row-" + i;
    row.innerHTML = `
      <span class="action-idx">${i+1}</span>
      <span class="action-name">${name}</span>
      <span class="action-time" id="action-time-${i}">—</span>
      <button class="action-mark-btn" data-idx="${i}">Mark</button>
    `;
    sequenceEl.appendChild(row);
  });
  sequenceEl.querySelectorAll(".action-mark-btn").forEach(btn => {
    btn.addEventListener("click", () => markAction(parseInt(btn.dataset.idx)));
  });
}
buildSequenceUI();

fileInput.addEventListener("change", (e) => {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    videos.push({
      file,
      name: file.name,
      url: URL.createObjectURL(file),
      marks: new Array(ACTIONS.length).fill(null),
      duration: null
    });
  });
  renderQueue();
  if (currentIdx === -1 && videos.length) loadVideo(0);
  uploadZone.style.display = "none";
  player.style.display = "block";
  scrubRow.style.display = "flex";
  playControls.style.display = "flex";
});

function renderQueue() {
  queueEl.innerHTML = "";
  videos.forEach((v, i) => {
    const complete = v.marks.every(m => m !== null);
    const div = document.createElement("div");
    div.className = "queue-item" + (i === currentIdx ? " active" : "") + (complete ? " complete" : "");
    div.textContent = v.name;
    div.addEventListener("click", () => loadVideo(i));
    queueEl.appendChild(div);
  });
  const doneCount = videos.filter(v => v.marks.every(m => m !== null)).length;
  statusLine.textContent = videos.length
    ? `${doneCount} / ${videos.length} videos fully labeled`
    : "No videos loaded";
}

function loadVideo(idx) {
  currentIdx = idx;
  const v = videos[idx];
  player.src = v.url;
  player.load();
  renderQueue();
  refreshActionUI();
}

player.addEventListener("loadedmetadata", () => {
  videos[currentIdx].duration = player.duration;
  scrub.max = player.duration;
  durTime.textContent = player.duration.toFixed(2) + "s";
});

player.addEventListener("timeupdate", () => {
  scrub.value = player.currentTime;
  curTime.textContent = player.currentTime.toFixed(2) + "s";
});

scrub.addEventListener("input", () => {
  player.currentTime = parseFloat(scrub.value);
});

document.getElementById("playBtn").addEventListener("click", () => {
  if (player.paused) player.play(); else player.pause();
});
document.getElementById("backBtn").addEventListener("click", () => {
  player.currentTime = Math.max(0, player.currentTime - 0.1);
});
document.getElementById("fwdBtn").addEventListener("click", () => {
  player.currentTime = Math.min(player.duration, player.currentTime + 0.1);
});
document.querySelectorAll(".speed-group button").forEach(btn => {
  btn.addEventListener("click", () => {
    player.playbackRate = parseFloat(btn.dataset.speed);
    document.querySelectorAll(".speed-group button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

function markAction(i) {
  if (currentIdx === -1) return;
  videos[currentIdx].marks[i] = player.currentTime;
  refreshActionUI();
  renderQueue();
}

function refreshActionUI() {
  if (currentIdx === -1) return;
  const marks = videos[currentIdx].marks;
  ACTIONS.forEach((_, i) => {
    const t = marks[i];
    document.getElementById("action-time-" + i).textContent = t === null ? "—" : t.toFixed(2) + "s";
    document.getElementById("action-row-" + i).classList.toggle("marked", t !== null);
  });
}

document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentIdx > 0) loadVideo(currentIdx - 1);
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentIdx < videos.length - 1) loadVideo(currentIdx + 1);
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") {
    e.preventDefault();
    if (player.paused) player.play(); else player.pause();
  }
  const num = parseInt(e.key);
  if (num >= 1 && num <= 8) {
    markAction(num - 1);
  }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  let rows = ["filename,label,start,end"];
  videos.forEach(v => {
    if (!v.marks.every(m => m !== null) || v.duration === null) return; // skip incomplete
    for (let i = 0; i < ACTIONS.length; i++) {
      const start = v.marks[i];
      const end = (i + 1 < ACTIONS.length) ? v.marks[i + 1] : v.duration;
      rows.push(`${v.name},${ACTIONS[i]},${start.toFixed(3)},${end.toFixed(3)}`);
    }
  });
  if (rows.length === 1) {
    alert("No fully-labeled videos yet — mark all 8 actions for at least one video first.");
    return;
  }
  const blob = new Blob([rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "action_labels.csv";
  a.click();
});
</script>

</body>
</html>
